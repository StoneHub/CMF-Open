name: Android app

on:
  push:
    paths: ['android/**', 'web/public/apps/**', 'web/src/lib/__fixtures__/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'web/public/apps/**', 'web/src/lib/__fixtures__/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Protocol tests (byte-for-byte against the Python vectors)
        run: ./gradlew :protocol:test
      - name: Build debug APK
        if: hashFiles('android/app/build.gradle.kts') != ''
        run: ./gradlew :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmf-companion-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-debug.html
            android/protocol/build/reports/tests/
          if-no-files-found: ignore
